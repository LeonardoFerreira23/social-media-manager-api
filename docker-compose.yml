services:
  postgres:
    image: postgres:18
    container_name: sm-postgres
    environment:
      POSTGRES_DB: social-media-manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social-media-manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: social-media-manager
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/social-media-manager
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8081"

volumes:
  postgres-data: